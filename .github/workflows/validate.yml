name: Validate ETL pipeline
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m py_compile src/etl_pipeline.py
      - run: python src/etl_pipeline.py
      - run: test -s data/clean_events_warehouse.csv && test -s dashboards/quality_metrics.json
